name: assessment-ui-validation
on:
  push:
    branches: [feature/task-result-assessment]
    paths: [.github/workflows/assessment-ui-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Apply isolated route identity correction
        run: |
          test "$GITHUB_REF" = refs/heads/feature/task-result-assessment
          git merge-base --is-ancestor e64dc6fbb550ba74b4118217b07289b01091bb70 HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/views/TaskView.vue')
          text = path.read_text()
          old = 'const taskId = computed(() => String(route.params.id))'
          new = "// RouterView is keyed by fullPath; keep in-flight reads on this instance's task.\nconst taskId = ref(String(route.params.id))"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/assessment-ui-validation.yml
          git add frontend/src/views/TaskView.vue
          git diff --cached --check
      - name: Type check and build actual frontend
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build
      - name: Publish isolated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: pin task detail identity across in-flight route changes'
          git push origin HEAD:refs/heads/feature/task-result-assessment
          git rev-parse HEAD > "$RUNNER_TEMP/ui-commit.txt"
          git archive --format=zip -o "$RUNNER_TEMP/ui-source.zip" HEAD
          (cd frontend/dist && zip -qr "$RUNNER_TEMP/ui-frontend.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: assessment-ui-verified-build
          path: |
            ${{ runner.temp }}/ui-commit.txt
            ${{ runner.temp }}/ui-source.zip
            ${{ runner.temp }}/ui-frontend.zip
          retention-days: 1
          if-no-files-found: error
