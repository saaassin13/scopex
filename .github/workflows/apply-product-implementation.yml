name: apply-reviewed-product-implementation
on:
  push:
    branches: [feature/text-results-parallel-runs]
    paths: [.github/workflows/apply-product-implementation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'saaassin13/scopex' && github.ref == 'refs/heads/feature/text-results-parallel-runs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply assert-checked source edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scopex/api/service.py)" = '21e64632f4229f017aa417dc12d98adc6feec2b0'
          python3 .dev/apply_output.py
          python3 .dev/apply_admission.py
          python3 .dev/apply_api_ui.py
          python3 -m compileall -q scopex scripts tests
          git diff --check
          git add scopex scripts frontend
          git rm -r .dev
          git config user.name 'ScopeX implementation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement text-first reports, isolated parallel admission and global activity'
          git push origin HEAD:refs/heads/feature/text-results-parallel-runs
