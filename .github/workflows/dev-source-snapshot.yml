name: development-source-snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Build the real frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build
      - name: Archive tracked source and built UI
        run: |
          git archive --format=zip HEAD -o /tmp/scopex-source.zip
          cd frontend/dist && zip -qr /tmp/scopex-frontend.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: development-source
          path: |
            /tmp/scopex-source.zip
            /tmp/scopex-frontend.zip
          retention-days: 1
